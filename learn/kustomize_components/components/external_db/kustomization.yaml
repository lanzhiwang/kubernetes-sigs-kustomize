# $EXT_DB/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1alpha1 # <-- Component notation
kind: Component

secretGenerator:
  - name: dbpass
    files:
      - dbpass.txt

patches:
  - path: configmap.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: example
    path: deployment.yaml
