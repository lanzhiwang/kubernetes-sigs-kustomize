# 参考 type Kustomization struct
# ~/work/code/go_code/kustomize/api/types/kustomization.go

# ~/work/code/go_code/kustomize/api/types/typemeta.go
# TypeMeta `json:",inline" yaml:",inline"`
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ~/work/code/go_code/kustomize/api/types/objectmeta.go
# MetaData is a pointer to avoid marshalling empty struct
# MetaData *ObjectMeta `json:"metadata,omitempty" yaml:"metadata,omitempty"`
# metadata:
#   name:
#   namespace:
#   labels:
#   annotations:

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/openapi/
# OpenAPI contains information about what kubernetes schema to use.
# OpenAPI map[string]string `json:"openapi,omitempty" yaml:"openapi,omitempty"`
openapi:
  path: my_schema.json
  version: v1.20.4

###################################################
# Operators - what kustomize can do.
###################################################

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/nameprefix/
# NamePrefix will prefix the names of all resources mentioned in the kustomization
# file including generated configmaps and secrets.
# NamePrefix string `json:"namePrefix,omitempty" yaml:"namePrefix,omitempty"`
namePrefix: myprefix-

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/namesuffix/
# NameSuffix will suffix the names of all resources mentioned in the kustomization
# file including generated configmaps and secrets.
# NameSuffix string `json:"nameSuffix,omitempty" yaml:"nameSuffix,omitempty"`
nameSuffix: -mysuffix

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/namespace/
# Namespace to add to all objects.
# Namespace string `json:"namespace,omitempty" yaml:"namespace,omitempty"`
namespace: my-namespace

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/commonlabels/
# Deprecated: Use the Labels field instead, which provides a superset of the functionality of CommonLabels.
# CommonLabels to add to all objects and selectors.
# CommonLabels map[string]string `json:"commonLabels,omitempty" yaml:"commonLabels,omitempty"`
# commonLabels:
#   someName: someValue
#   owner: alice
#   app: bingo

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/labels/
# Labels to add to all objects but not selectors.
# Labels []Label `json:"labels,omitempty" yaml:"labels,omitempty"`
labels:
  - pairs:
      someName: someValue
      owner: alice
      app: bingo
    includeSelectors: true # <-- false by default
    includeTemplates: true # <-- false by default

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/commonannotations/
# CommonAnnotations to add to all objects.
# CommonAnnotations map[string]string `json:"commonAnnotations,omitempty" yaml:"commonAnnotations,omitempty"`
commonAnnotations:
  oncallPager: 800-555-1212

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patchesstrategicmerge/
# Deprecated: Use the Patches field instead, which provides a superset of the functionality of PatchesStrategicMerge.
# PatchesStrategicMerge specifies the relative path to a file
# containing a strategic merge patch.  Format documented at
# https://github.com/kubernetes/community/blob/master/contributors/devel/sig-api-machinery/strategic-merge-patch.md
# URLs and globs are not supported.
# PatchesStrategicMerge []PatchStrategicMerge `json:"patchesStrategicMerge,omitempty" yaml:"patchesStrategicMerge,omitempty"`
# patchesStrategicMerge:
#   - patch-pod.yaml
#   - service_port_8888.yaml
#   - deployment_increase_replicas.yaml
#   - deployment_increase_memory.yaml
#   - |-
#     apiVersion: apps/v1
#     kind: Deployment
#     metadata:
#       name: nginx
#     spec:
#       template:
#         spec:
#           containers:
#             - name: nginx
#               image: nignx:latest

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patchesjson6902/
# Deprecated: Use the Patches field instead, which provides a superset of the functionality of JSONPatches.
# JSONPatches is a list of JSONPatch for applying JSON patch.
# Format documented at https://tools.ietf.org/html/rfc6902
# and http://jsonpatch.com
# PatchesJson6902 []Patch `json:"patchesJson6902,omitempty" yaml:"patchesJson6902,omitempty"`
# patchesJson6902:
#   - target:
#       version: v1
#       kind: Pod
#       name: myapp
#     path: patch.yaml
#   - target:
#       version: v1
#       kind: Deployment
#       name: my-deployment
#     path: add_init_container.yaml
#   - target:
#       version: v1
#       kind: Service
#       name: my-service
#     path: add_service_annotation.yaml
#   - target:
#       version: v1
#       kind: Deployment
#       name: my-deployment
#     patch: |-
#       - op: add
#         path: /some/new/path
#         value: value
#       - op: replace
#         path: /some/existing/path
#         value: "new value"

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/patches/
# Patches is a list of patches, where each one can be either a
# Strategic Merge Patch or a JSON patch.
# Each patch can be applied to multiple target objects.
# Patches []Patch `json:"patches,omitempty" yaml:"patches,omitempty"`
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: myapp
    #########
  - path: patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: deploy.*
      labelSelector: "env=dev"
      annotationSelector: "zone=west"
    options:
      allowNameChange: true
      allowKindChange: true
  #########
  - patch: |-
      - op: replace
        path: /some/existing/path
        value: new value
    target:
      kind: MyKind
      labelSelector: "env=dev"
    options:
      allowNameChange: true
      allowKindChange: true
  #########
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dummy-app
        labels:
          app.kubernetes.io/version: 1.21.0
  #########
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
      spec:
        template:
          spec:
            containers:
              - name: nginx
                image: nginx:1.21.0
    target:
      labelSelector: "app.kubernetes.io/name=nginx"
  #########
  - patch: |-
      - op: add
        path: /metadata/labels/app.kubernetes.io~1version
        value: 1.21.0
    target:
      group: apps
      version: v1
      kind: Deployment
  #########
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: nginx:1.21.0
    target:
      labelSelector: "app.kubernetes.io/name=nginx"
  #########
  - path: add-label.patch.yaml
  - path: fix-version.patch.yaml
    target:
      labelSelector: "app.kubernetes.io/name=nginx"
  #########
  - path: add-label.patch.json
    target:
      group: apps
      version: v1
      kind: Deployment
  - path: fix-version.patch.yaml
    target:
      labelSelector: "app.kubernetes.io/name=nginx"

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/images/
# Images is a list of (image name, new name, new tag or digest)
# for changing image names, tags or digests. This can also be achieved with a
# patch, but this operator is simpler to specify.
# Images []Image `json:"images,omitempty" yaml:"images,omitempty"`
images:
  - name: postgres
    newName: my-registry/my-postgres
    newTag: v1
  - name: nginx
    newTag: "1.8.0"
  - name: my-demo-app
    newName: my-app
  - name: alpine
    digest: sha256:24a0c4b4a4c0eb97a1aabb8e29f18e917d05abfe1b7a7c07857230879ce7d3d3

# Deprecated: Use the Images field instead.
# ImageTags []Image `json:"imageTags,omitempty" yaml:"imageTags,omitempty"`
# imageTags:

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replacements/
# Replacements is a list of replacements, which will copy nodes from a
# specified source to N specified targets.
# Replacements []ReplacementField `json:"replacements,omitempty" yaml:"replacements,omitempty"`
replacements:
  - path: replacement.yaml
  - source:
      name: myapp
      kind: Service
      version: v1
    targets:
      - select:
          kind: Pod
          name: myapp
        fieldPaths:
          - spec.containers.[name=myapp].args.1

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/replicas/
# Replicas is a list of {resourcename, count} that allows for simpler replica
# specification. This can also be done with a patch.
# Replicas []Replica `json:"replicas,omitempty" yaml:"replicas,omitempty"`
replicas:
  - name: another-app
    count: 3

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/vars/
# Deprecated: Vars will be removed in future release. Migrate to Replacements instead.
# Vars allow things modified by kustomize to be injected into a
# kubernetes object specification. A var is a name (e.g. FOO) associated
# with a field in a specific resource instance.  The field must
# contain a value of type string/bool/int/float, and defaults to the name field
# of the instance.  Any appearance of "$(FOO)" in the object
# spec will be replaced at kustomize build time, after the final
# value of the specified field has been determined.
# Vars []Var `json:"vars,omitempty" yaml:"vars,omitempty"`
# vars:
#   - name: MY_SERVICE_NAME
#     objref:
#       name: myapp
#       kind: Service
#       apiVersion: v1
#     fieldref:
#       fieldpath: metadata.name

# SortOptions change the order that kustomize outputs resources.
# SortOptions *SortOptions `json:"sortOptions,omitempty" yaml:"sortOptions,omitempty"`
# sortOptions:

###################################################
# Operands - what kustomize operates on.
###################################################

# Resources specifies relative paths to files holding YAML representations
# of kubernetes API objects, or specifications of other kustomizations
# via relative paths, absolute paths, or URLs.
# Resources []string `json:"resources,omitempty" yaml:"resources,omitempty"`
resources:
  # Local files
  - myNamespace.yaml
  - deployment.yaml
  - sub-dir/some-deployment.yaml
  # Local directories
  - ../../commonbase
  # Remote URLs
  - https://github.com/kubernetes-sigs/kustomize//examples/multibases/?timeout=120&ref=v3.3.1
  # Legacy hashicorp/go-getter format
  - github.com/kubernets-sigs/kustomize/examples/helloWorld?ref=test-branch

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/components/
# https://kubectl.docs.kubernetes.io/guides/config_management/components/
# Components specifies relative paths to specifications of other Components
# via relative paths, absolute paths, or URLs.
# Components []string `json:"components,omitempty" yaml:"components,omitempty"`
components:
  - ../components/common-annotations

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/crds/
# Crds specifies relative paths to Custom Resource Definition files.
# This allows custom resources to be recognized as operands, making
# it possible to add them to the Resources list.
# CRDs themselves are not modified.
# Crds []string `json:"crds,omitempty" yaml:"crds,omitempty"`
crds:
  - crds/typeA.yaml
  - crds/typeB.yaml

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/bases/
# Deprecated: Anything that would have been specified here should be specified in the Resources field instead.
# Bases []string `json:"bases,omitempty" yaml:"bases,omitempty"`
# bases:

###################################################
# Generators (operators that create operands)
###################################################

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/configmapgenerator/
# ConfigMapGenerator is a list of configmaps to generate from
# local data (one configMap per list item).
# The resulting resource is a normal operand, subject to
# name prefixing, patching, etc.  By default, the name of
# the map will have a suffix hash generated from its contents.
# ConfigMapGenerator []ConfigMapArgs `json:"configMapGenerator,omitempty" yaml:"configMapGenerator,omitempty"`
configMapGenerator:
  - name: my-java-server-props
    behavior: merge
    files:
      - application.properties
      - more.properties
  - name: my-java-server-env-file-vars
    envs:
      - my-server-env.properties
      - more-server-props.env
  - name: my-java-server-env-vars
    literals:
      - JAVA_HOME=/opt/java/jdk
      - JAVA_TOOL_OPTIONS=-agentlib:hprof
    options:
      disableNameSuffixHash: true
      labels:
        pet: dog
  - name: dashboards
    files:
      - mydashboard.json
    options:
      annotations:
        dashboard: "1"
      labels:
        app.kubernetes.io/name: "app1"

# SecretGenerator is a list of secrets to generate from
# local data (one secret per list item).
# The resulting resource is a normal operand, subject to
# name prefixing, patching, etc.  By default, the name of
# the map will have a suffix hash generated from its contents.
# SecretGenerator []SecretArgs `json:"secretGenerator,omitempty" yaml:"secretGenerator,omitempty"`
secretGenerator:
  - name: app-secret
    envs:
      - secrets.properties

# HelmGlobals contains helm configuration that isn't chart specific.
# HelmGlobals *HelmGlobals `json:"helmGlobals,omitempty" yaml:"helmGlobals,omitempty"`
# helmGlobals:

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/helmcharts/
# HelmCharts is a list of helm chart configuration instances.
# HelmCharts []HelmChart `json:"helmCharts,omitempty" yaml:"helmCharts,omitempty"`
# helmCharts:

# HelmChartInflationGenerator is a list of helm chart configurations.
# Deprecated.  Auto-converted to HelmGlobals and HelmCharts.
# HelmChartInflationGenerator []HelmChartArgs `json:"helmChartInflationGenerator,omitempty" yaml:"helmChartInflationGenerator,omitempty"`
# helmChartInflationGenerator:

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/generatoroptions/
# GeneratorOptions modify behavior of all ConfigMap and Secret generators.
# GeneratorOptions *GeneratorOptions `json:"generatorOptions,omitempty" yaml:"generatorOptions,omitempty"`
generatorOptions:
  # labels to add to all generated resources
  labels:
    kustomize.generated.resources: somevalue
  # annotations to add to all generated resources
  annotations:
    kustomize.generated.resource: somevalue
  # disableNameSuffixHash is true disables the default behavior of adding a
  # suffix to the names of generated resources that is a hash of
  # the resource contents.
  disableNameSuffixHash: true
  # if set to true, the immutable property is added to generated resources
  immutable: true

# Configurations is a list of transformer configuration files
# Configurations []string `json:"configurations,omitempty" yaml:"configurations,omitempty"`
configurations:
  - configuration.yaml

# Generators is a list of files containing custom generators
# Generators []string `json:"generators,omitempty" yaml:"generators,omitempty"`
generators:
  - generators.yaml

# Transformers is a list of files containing transformers
# Transformers []string `json:"transformers,omitempty" yaml:"transformers,omitempty"`
transformers:
  - transformers.yaml

# Validators is a list of files containing validators
# Validators []string `json:"validators,omitempty" yaml:"validators,omitempty"`
validators:
  - validators.yaml

# https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/buildmetadata/
# BuildMetadata is a list of strings used to toggle different build options
# BuildMetadata []string `json:"buildMetadata,omitempty" yaml:"buildMetadata,omitempty"`
buildMetadata: [managedByLabel, originAnnotations, transformerAnnotations]
