apiVersion: v1
data:
  application.properties: |
    app.name=Staging Kinflate Demo
    spring.jpa.hibernate.ddl-auto=update
    spring.datasource.url=jdbc:mysql://<production_db_ip>:3306/db_example
    spring.datasource.username=root
    spring.datasource.password=admin
kind: ConfigMap
metadata:
  name: demo-configmap-62hfmb8t97
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: sbdemo
  name: sbdemo
spec:
  ports:
  - port: 8080
  selector:
    app: sbdemo
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sbdemo
  name: sbdemo
spec:
  selector:
    matchLabels:
      app: sbdemo
  template:
    metadata:
      labels:
        app: sbdemo
    spec:
      containers:
      - image: jingfang/sbdemo
        name: sbdemo
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /config
          name: demo-config
      volumes:
      - configMap:
          name: demo-configmap-62hfmb8t97
        name: demo-config
