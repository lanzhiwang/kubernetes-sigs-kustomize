apiVersion: v1
data:
  application.properties: |
    app.name=Production Kinflate Demo
    spring.jpa.hibernate.ddl-auto=update
    spring.datasource.url=jdbc:mysql://<production_db_ip>:3306/db_example
    spring.datasource.username=root
    spring.datasource.password=admin
    server.tomcat.max-threads=20  #
    server.tomcat.min-spare-threads=3  #
kind: ConfigMap
metadata:
  name: production-demo-configmap-6d62b7m2kc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: sbdemo
  name: production-sbdemo  #
spec:
  ports:
  - port: 8080
  selector:
    app: sbdemo
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sbdemo
  name: production-sbdemo  #
spec:
  replicas: 2  #
  selector:
    matchLabels:
      app: sbdemo
  template:
    metadata:
      labels:
        app: sbdemo
    spec:
      containers:
      - env:  #
        - name: MEM_TOTAL_MB
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
        image: jingfang/sbdemo
        livenessProbe:  #
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 3
        name: sbdemo
        ports:
        - containerPort: 8080
        readinessProbe:  #
          httpGet:
            path: /actuator/info
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:  #
          limits:
            memory: 1250Mi
          requests:
            memory: 1250Mi
        volumeMounts:
        - mountPath: /config
          name: demo-config
      volumes:
      - configMap:
          name: production-demo-configmap-6d62b7m2kc
        name: demo-config
